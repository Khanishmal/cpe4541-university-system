apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: cust-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
      - name: registration
        image: registration-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: cust-system
spec:
  selector:
    app: registration
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP