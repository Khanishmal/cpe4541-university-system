apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-service
  namespace: cust-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms
  template:
    metadata:
      labels:
        app: lms
    spec:
      containers:
      - name: lms
        image: lms-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: lms-service
  namespace: cust-system
spec:
  selector:
    app: lms
  ports:
  - port: 80
    targetPort: 8001
  type: ClusterIP