apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  namespace: cust-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam
  template:
    metadata:
      labels:
        app: exam
    spec:
      containers:
      - name: exam
        image: exam-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: exam-service
  namespace: cust-system
spec:
  selector:
    app: exam
  ports:
  - port: 80
    targetPort: 8002
  type: ClusterIP